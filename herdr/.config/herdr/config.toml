onboarding = false
[keys]
prefix = "ctrl+space"
detach = "prefix+d"
reload_config = "prefix+r"
next_agent = "prefix+a"

# Workspaces (tmux sessions).
# Herdr has no last-session/last-tab action; its global pane focus history is
# the closest equivalent to tmux's switch-client -l and last-window.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
last_pane = ["prefix+shift+s", "prefix+space"]
close_workspace = "prefix+shift+x"

# Tabs (tmux windows).
new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = ["prefix+p", "prefix+ctrl+p"]
next_tab = ["prefix+n", "prefix+ctrl+n"]
switch_tab = "prefix+1..9"
close_tab = "prefix+ampersand"

# Panes.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+%"
split_horizontal = "prefix+\""
close_pane = "prefix+x"
resize_mode = "prefix+shift+r"

[ui]
prompt_new_tab_name = false

agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = false
status_indicators = "symbols"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent", "state_text"],
]

[theme]
name = "kanagawa"
auto_switch = false

[ui.toast]
delivery = "terminal"
